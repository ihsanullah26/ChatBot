services:
  chatbot:
    build: .
    container_name: chatbot
    ports:
      - "8000:8000"
    environment:
      env_file: .env
    depends_on:
      - db
  
  db:
    build:
      context: ./database-dockerfile
    container_name: chatbot-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
      MYSQL_DATABASE: mydatabase
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
    